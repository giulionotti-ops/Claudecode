<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neesmo Code Map</title>
<link rel="icon" href="/static/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;1,900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #17110E; --ink: #F4EDE4; --dim: rgba(244,237,228,.6); --or: #EF8746; --glass: rgba(30,23,19,.62); --edge: rgba(255,255,255,.14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Archivo, system-ui, sans-serif; overflow: hidden; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #g { position: fixed; inset: 0; }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 48px -16px rgba(0,0,0,.6); }
  header { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 2; }
  header > * { pointer-events: auto; }
  a.pill, .pill { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px; }
  h1 { margin: 0 6px; font: 900 italic 28px/1 Archivo, sans-serif; letter-spacing: -.03em; color: var(--or); }
  #search { flex: 0 1 280px; min-width: 0; border: 1px solid var(--edge); background: var(--glass); color: var(--ink); font: 500 14px Archivo, sans-serif; min-height: 42px; padding: 0 16px; border-radius: 999px; outline: none; }
  #search:focus { border-color: var(--or); }
  #stats { font-size: 13px; color: var(--dim); font-weight: 500; }
  #legend { position: fixed; left: 16px; bottom: 16px; padding: 12px 14px; border-radius: 18px; display: flex; flex-direction: column; gap: 6px; max-height: 45vh; overflow: auto; z-index: 2; font-size: 13px; }
  #legend button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 2px 4px; border-radius: 6px; color: var(--ink); }
  #legend button[aria-pressed="false"] { opacity: .35; }
  #legend button:focus-visible { outline: 2px solid var(--or); }
  #legend i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #panel { position: fixed; top: 74px; right: 16px; bottom: 16px; width: min(380px, calc(100vw - 32px)); border-radius: 22px; padding: 20px; overflow: auto; z-index: 3; transform: translateX(calc(100% + 24px)); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  #panel.on { transform: none; }
  #panel h2 { margin: 0 0 4px; font: 900 italic 26px/1.1 Archivo, sans-serif; letter-spacing: -.02em; word-break: break-word; padding-right: 36px; }
  #panel .where { color: var(--or); font-size: 13px; font-weight: 700; word-break: break-all; }
  #panel .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  #panel .tags span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--dim); }
  #panel pre { margin: 0 0 14px; padding: 12px; border-radius: 12px; background: rgba(0,0,0,.4); font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; color: #EDE3D6; max-height: 240px; overflow: auto; }
  #panel h3 { margin: 16px 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #panel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  #panel li button { all: unset; cursor: pointer; display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 6px 8px; border-radius: 8px; font-size: 14px; }
  #panel li button:hover, #panel li button:focus-visible { background: rgba(255,255,255,.08); }
  #panel li small { color: var(--dim); font-size: 11px; margin-left: auto; white-space: nowrap; }
  #close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--edge); background: rgba(255,255,255,.06); color: var(--ink); font-size: 18px; cursor: pointer; }
  #tip { position: fixed; bottom: 16px; right: 16px; font-size: 12px; color: var(--dim); z-index: 1; padding: 8px 14px; border-radius: 999px; }
  @media (max-width: 700px) { #legend { display: none; } #panel { top: auto; height: 60vh; transform: translateY(calc(100% + 24px)); } #tip { display: none; } h1 { font-size: 22px; } }
</style>
<script>if (window.EMBED) document.write("<style>#back{display:none}header{padding-right:64px}</style>")</script>
</head>
<body>
<canvas id="bg"></canvas>
<div id="g" aria-label="3D map of Neesmo's code. Drag to rotate, scroll to zoom, click a dot for details."></div>
<header>
  <a class="pill glass" id="back" href="/">← Neesmo</a>
  <h1>Code map</h1>
  <input id="search" class="glass" type="search" placeholder="Find a function or file" aria-label="Find a function or file">
  <span id="stats"></span>
</header>
<nav id="legend" class="glass" aria-label="Files"></nav>
<aside id="panel" class="glass" aria-live="polite"><button id="close" aria-label="Close">×</button><div id="body"></div></aside>
<div id="tip" class="glass">Drag to rotate · scroll to zoom · click a dot</div>
<script src="/static/robot/3d-force-graph.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PAL = ['#EF8746', '#7FD6A4', '#F2C14E', '#6FA8FF', '#F27C9B', '#B79CFF', '#5ED3D9', '#E6E1D8', '#FF6B4A', '#A8D86E', '#D99A6C', '#8FB3C9', '#C98BD9', '#E8D36A'];
(async () => {
  const data = await (await fetch('/api/graph')).json();
  const files = [...new Set(data.nodes.map(n => n.file))].sort((a, b) => data.nodes.filter(n => n.file === b).length - data.nodes.filter(n => n.file === a).length);
  const color = Object.fromEntries(files.map((f, i) => [f, PAL[i % PAL.length]]));
  const byId = Object.fromEntries(data.nodes.map(n => [n.id, n]));
  const nb = {}; data.links.forEach(l => { (nb[l.source] ||= []).push([l.target, l.relation, 'out']); (nb[l.target] ||= []).push([l.source, l.relation, 'in']); });
  $('#stats').textContent = `${data.nodes.length} nodes · ${data.links.length} links · ${files.length} files`;
  const hidden = new Set(); let sel = null, hits = null;
  const visible = n => !hidden.has(n.file);
  const G = ForceGraph3D({ controlType: 'orbit', rendererConfig: { alpha: true, antialias: true } })($('#g')).showNavInfo(false)
    .backgroundColor('rgba(0,0,0,0)').graphData(data)
    .nodeId('id').nodeLabel(n => `<b>${esc(n.label)}</b><br><span style="opacity:.7">${esc(n.file)} ${esc(n.line)}</span>`)
    .nodeVal(n => 1 + Math.sqrt(n.deg) * 1.6).nodeRelSize(3.2).nodeOpacity(.95).nodeResolution(12)
    .nodeColor(n => hits && !hits.has(n.id) ? 'rgba(120,110,100,.25)' : sel && n !== sel && !(nb[sel.id] || []).some(([id]) => id === n.id) ? 'rgba(120,110,100,.35)' : color[n.file])
    .nodeVisibility(visible)
    .linkVisibility(l => visible(l.source.id ? l.source : byId[l.source]) && visible(l.target.id ? l.target : byId[l.target]))
    .linkColor(l => { const on = sel && (l.source === sel || l.target === sel); return on ? '#FFB27A' : sel ? 'rgba(244,237,228,.1)' : (color[(l.source.id ? l.source : byId[l.source]).file] || '#F4EDE4') + 'B0'; })
    .linkWidth(l => sel && (l.source === sel || l.target === sel) ? 2.4 : sel ? 0.2 : 0.7).linkOpacity(.9)
    .linkDirectionalParticles(l => sel && (l.source === sel || l.target === sel) ? 3 : 0).linkDirectionalParticleWidth(2).linkDirectionalParticleColor(() => '#EF8746')
    .onNodeClick(pick).onBackgroundClick(() => { sel = null; $('#panel').classList.remove('on'); refresh(); });
  G.d3Force('charge').strength(-40);
  let fitted = false; G.onEngineStop(() => { if (!fitted) { fitted = true; G.zoomToFit(800, 40); } });
  const refresh = () => G.nodeColor(G.nodeColor()).linkColor(G.linkColor()).linkWidth(G.linkWidth()).linkDirectionalParticles(G.linkDirectionalParticles());
  function fly(n) {
    const d = 90, r = 1 + d / Math.hypot(n.x || 1, n.y || 1, n.z || 1);
    G.cameraPosition({ x: (n.x || 0) * r, y: (n.y || 0) * r, z: (n.z || 0) * r }, n, 1200);
  }
  function pick(n) {
    spin = false; sel = n; refresh(); fly(n);
    const rel = (nb[n.id] || []).map(([id, r, dir]) => [byId[id], r, dir]).filter(([m]) => m);
    const group = (dir, title) => { const xs = rel.filter(r => r[2] === dir); return xs.length ? `<h3>${title} · ${xs.length}</h3><ul>${xs.map(([m, r]) =>
      `<li><button data-id="${esc(m.id)}"><i style="width:8px;height:8px;border-radius:50%;flex:none;background:${color[m.file]}"></i>${esc(m.label)}<small>${esc(r.replace(/_/g, ' '))}</small></button></li>`).join('')}</ul>` : ''; };
    $('#body').innerHTML = `<h2>${esc(n.label)}</h2><div class="where">${esc(n.file)} ${esc(n.line)}</div>
      <div class="tags"><span>${esc(n.type || 'node')}</span>${n.group && n.group !== n.file ? `<span>${esc(n.group)}</span>` : ''}<span>${n.deg} links</span></div>
      ${n.code ? `<pre>${esc(n.code)}</pre>` : ''}${group('out', 'Uses')}${group('in', 'Used by')}`;
    $('#panel').classList.add('on');
  }
  $('#body').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) pick(byId[b.dataset.id]); });
  $('#close').onclick = () => { sel = null; $('#panel').classList.remove('on'); refresh(); };
  $('#legend').innerHTML = files.map(f => `<button aria-pressed="true" data-f="${esc(f)}"><i style="background:${color[f]}"></i>${esc(f.replace(/^vega\//, ''))}</button>`).join('');
  $('#legend').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const on = b.getAttribute('aria-pressed') === 'true'; b.setAttribute('aria-pressed', String(!on));
    on ? hidden.add(b.dataset.f) : hidden.delete(b.dataset.f); G.nodeVisibility(G.nodeVisibility()).linkVisibility(G.linkVisibility());
  });
  $('#search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    hits = q ? new Set(data.nodes.filter(n => (n.label + ' ' + n.file).toLowerCase().includes(q)).map(n => n.id)) : null; refresh();
  });
  $('#search').addEventListener('keydown', e => { if (e.key === 'Enter' && hits && hits.size) pick(byId[[...hits][0]]); });
  addEventListener('keydown', e => { if (e.key === 'Escape') $('#close').click(); });
  addEventListener('resize', () => G.width(innerWidth).height(innerHeight));
  // a dotted sphere around the graph, seen from inside (only the far wall shows); it ripples and turns slowly
  G.controls().maxDistance = 1000;
  fetch('/static/robot/three.min.js').then(r => r.text()).then(txt => { const ex = {}; new Function('exports', 'module', txt)(ex, { exports: ex }); const THREE = ex;
  const cv = $('#bg'), R = 1600, N = 14000;
    const rn = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true }); rn.setPixelRatio(Math.min(devicePixelRatio, 2));
    const sc = new THREE.Scene(), bc = new THREE.PerspectiveCamera(40, 1, 10, 6000);
    const pos = new Float32Array(N * 3), ph = new Float32Array(N), ga = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) { const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), t = i * ga; pos.set([Math.cos(t) * r, y, Math.sin(t) * r], i * 3); ph[i] = Math.random(); }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
    const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { t: { value: 0 }, R: { value: R }, k: { value: rn.getPixelRatio() } },
      vertexShader: `attribute float ph; uniform float t, R, k; varying float a;
        void main() { vec3 d = position;
          float w = sin(d.x * 5. + t * .5) * sin(d.y * 4. - t * .4) + sin(d.z * 6. + d.y * 3. + t * .35) * .6;
          float rr = R * (1. + .05 * w); vec4 mv = modelViewMatrix * vec4(d * rr, 1.);
          a = .11 + .2 * (.5 + .5 * sin(t * 1.4 + ph * 40.)) * ph + .11 * smoothstep(.2, 1., w * .5 + .5);
          gl_PointSize = k * (2.2 + 2.0 * ph); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `varying float a; void main() { float d = length(gl_PointCoord - .5); if (d > .5) discard; gl_FragColor = vec4(.93, .9, .86, a * (1. - d * 1.6)); }` });
    const orb = new THREE.Points(geo, mat); sc.add(orb);
    const fit = () => { rn.setSize(innerWidth, innerHeight, false); bc.aspect = innerWidth / innerHeight; bc.updateProjectionMatrix(); };
    fit(); addEventListener('resize', fit);
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    (function loop(ms) { const gc = G.camera(); bc.fov = gc.fov; bc.position.copy(gc.position); bc.quaternion.copy(gc.quaternion); bc.updateProjectionMatrix();
      if (!still) { mat.uniforms.t.value = ms / 1000; orb.rotation.y = ms / 90000; orb.rotation.x = Math.sin(ms / 40000) * .12; }
      rn.render(sc, bc); requestAnimationFrame(loop); })(0);
  });
  // a slow turn until you touch it
  let spin = !matchMedia('(prefers-reduced-motion: reduce)').matches, ang;
  ['pointerdown', 'wheel'].forEach(ev => $('#g').addEventListener(ev, () => spin = false, { once: true }));
  setTimeout(() => { const tick = () => { if (!spin) return; const c = G.cameraPosition(), d = Math.hypot(c.x, c.z) || 500; ang = Math.atan2(c.x, c.z) + .0015; G.cameraPosition({ x: d * Math.sin(ang), y: c.y, z: d * Math.cos(ang) }); requestAnimationFrame(tick); }; tick(); }, 1500);
})();
</script>
</body>
</html>
