<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neesmo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<meta name="theme-color" content="#02070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neesmo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --c: #3dff8f; --c2: #c6ff4a; --bg: #02070d; --dim: rgba(61,255,143,.35); --err: #ff5f6d; }
  * { box-sizing: border-box; }
  html { background-color: #02070d; min-height: 100lvh; }  /* iPhone home-screen app paints the area under the page with this */
  html, body { margin: 0; height: 100%; background: var(--bg) radial-gradient(ellipse at center, #06331a 0%, var(--bg) 70%) no-repeat fixed; color: var(--c);
    font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow: hidden; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(61,255,143,.03) 0 1px, transparent 1px 3px); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .corner { position: fixed; padding: 16px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .tl { top: env(safe-area-inset-top); left: env(safe-area-inset-left); } .tr { top: env(safe-area-inset-top); right: env(safe-area-inset-right); text-align: right; }
  .corner b { color: var(--c); font-weight: 600; }
  #status { position: fixed; left: 0; right: 0; top: calc(50% + min(26vmin, 210px)); text-align: center;
    letter-spacing: .4em; text-transform: uppercase; font-size: 13px; text-shadow: 0 0 8px var(--c); }
  #status.err { color: var(--err); text-shadow: 0 0 8px var(--err); letter-spacing: .1em; }
  #log { position: fixed; left: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); width: min(420px, calc(100% - 32px)); max-height: 30vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 6px; mask-image: linear-gradient(transparent, #000 30%); padding-top: 24px; }
  #log p { margin: 0; padding: 6px 10px; border-left: 2px solid var(--dim); background: rgba(61,255,143,.05); }
  #log p.you { border-color: var(--c2); color: var(--c2); }
  form { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 8px; max-width: 720px; margin: 0 auto; }
  input, select, button { font: inherit; color: var(--c); background: rgba(2,20,30,.8); border: 1px solid var(--dim); border-radius: 4px; }
  input { flex: 1; min-width: 0; padding: 12px; outline: none; }
  input:focus, select:focus, button:focus-visible { border-color: var(--c); box-shadow: 0 0 10px var(--dim); outline: none; }
  button { padding: 0 16px; cursor: pointer; letter-spacing: .1em; }
  #mic { width: 48px; padding: 0; font-size: 18px; }
  #mic.on { color: var(--bg); background: var(--c2); border-color: var(--c2); box-shadow: 0 0 16px var(--c2); }
  select { padding: 4px; max-width: 180px; }
  #bell { margin-top: 6px; padding: 3px 8px; font-size: 11px; }
  #bell[hidden] { display: none; }
  .cards { position: fixed; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; width: 190px; }
  .cards.l { left: 16px; } .cards.r { right: 16px; }
  .card { padding: 10px 12px; border: 1px solid var(--dim); border-radius: 6px; background: rgba(2,26,14,.6); }
  .card span { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .card b { display: block; font-size: 22px; font-weight: 600; text-shadow: 0 0 8px var(--dim); }
  .card small { color: var(--dim); font-size: 11px; }
  .agent { text-align: left; cursor: pointer; font: inherit; color: var(--c); width: 100%; }
  .agent { --a: var(--c); border-color: color-mix(in srgb, var(--a) 45%, transparent); border-left: 3px solid var(--a);
    background: linear-gradient(90deg, color-mix(in srgb, var(--a) 14%, transparent), rgba(2,26,14,.6) 70%); }
  .agent b { color: var(--a); text-shadow: 0 0 8px color-mix(in srgb, var(--a) 50%, transparent) !important; }
  .agent:hover, .agent:focus-visible { border-color: var(--a); box-shadow: 0 0 14px color-mix(in srgb, var(--a) 45%, transparent); outline: none; }
  .agent b { font-size: 14px !important; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent .st { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent .st .ago { display: inline; }
  .st.working { color: var(--c2); text-shadow: 0 0 8px var(--c2); } .st.idle { color: var(--c); } .st.offline { color: var(--err); }
  .st.working::before { content: "● "; animation: pulse 1.2s infinite; } .st.idle::before { content: "● "; } .st.offline::before { content: "○ "; }
  @keyframes pulse { 50% { opacity: .2; } }
  .agent small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  dialog#report { --a: var(--c); border-top: 3px solid var(--a) !important; width: min(1100px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; border: 1px solid var(--dim); border-radius: 10px;
    background: rgba(2,14,10,.97); color: var(--c); box-shadow: 0 0 40px rgba(61,255,143,.15); }
  dialog#report::backdrop { background: rgba(0,0,0,.7); backdrop-filter: blur(3px); }
  .rp { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .rp header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .rp h2 { color: var(--a); margin: 0; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 0 10px var(--dim); }
  .rp h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .rp small { color: var(--dim); } #r-close { padding: 6px 12px; font-size: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--dim); border-radius: 6px; padding: 10px 12px; background: rgba(2,26,14,.6); }
  .kpi span { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px var(--dim); }
  .kpi i { display: block; height: 4px; margin-top: 6px; background: rgba(61,255,143,.15); border-radius: 2px; overflow: hidden; }
  .kpi i::after { content: ""; display: block; height: 100%; width: var(--w, 0%); background: var(--a, var(--c)); }
  #report .kpi { border-color: color-mix(in srgb, var(--a) 40%, transparent); } #report .kpi b { color: var(--a); }
  #report .grid section { border-color: color-mix(in srgb, var(--a) 25%, transparent); } #report .list li { border-left-color: color-mix(in srgb, var(--a) 60%, transparent); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid section { border: 1px solid rgba(61,255,143,.2); border-radius: 6px; padding: 12px; background: rgba(2,20,12,.5); min-width: 0; }
  .grid .wide { grid-column: 1 / -1; }
  .pre { white-space: pre-wrap; margin: 0; max-height: 220px; overflow: auto; line-height: 1.5; }
  .list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow: auto; }
  .list li { border-left: 2px solid var(--dim); padding: 2px 8px; overflow-wrap: anywhere; }
  .list li em { font-style: normal; color: var(--dim); margin-right: 6px; } .mono li { font-size: 12px; }
  .bar { display: grid; grid-template-columns: 90px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 6px; }
  .bar i { height: 8px; background: rgba(61,255,143,.15); border-radius: 4px; overflow: hidden; }
  .bar i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--a, var(--c2)); }
  .actions { display: flex; justify-content: flex-end; } .actions button { padding: 10px 16px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .rp { padding: 14px; } .kpis { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .kpi { padding: 8px; } .kpi b { font-size: 16px; } .kpi span { font-size: 9px; } .agent .st .ago { display: none; } .agent .st { font-size: 10px; } }
  @media (max-width: 900px) {  /* phones and narrow windows: two scrolling strips under the clock */
    .cards { flex-direction: row; transform: none; left: 16px; right: 16px; width: auto; overflow-x: auto; gap: 8px; }
    /* phones: the circle moves up, agent cards sit below it in two rows above the input */
    .cards { top: auto; overflow: visible; }
    .cards.l { bottom: calc(138px + env(safe-area-inset-bottom)); } .cards.r { bottom: calc(76px + env(safe-area-inset-bottom)); }
    .card { flex: 1 1 0; min-width: 0; padding: 6px 10px; } .card b { font-size: 15px; } .card small { display: none; }
    #status { top: calc(40% + min(26vmin, 210px)); }
    #log { bottom: calc(204px + env(safe-area-inset-bottom)); max-height: 16vh; }
  }
</style>
</head>
<body>
<canvas id="hud" aria-hidden="true"></canvas>
<div class="corner tl">Neesmo // online<br><b id="clock">--:--:--</b><br><span id="date"></span></div>
<div class="corner tr"><label for="voice">Voice</label><br><select id="voice"><option>loading…</option></select><br><span id="vs">voice: …</span><br><button type="button" id="bell" hidden>🔔 Notifications</button></div>
<div class="cards l" id="agents-l" aria-label="Agents"></div>
<div class="cards r" id="agents-r" aria-label="Agents"></div>
<dialog id="report" aria-labelledby="r-name"><div class="rp">
  <header><div><h2 id="r-name">Agent</h2><small id="r-sub"></small></div><button type="button" id="r-close" aria-label="Close">✕</button></header>
  <div class="kpis" id="r-kpis"></div>
  <div class="grid">
    <section class="wide"><h3>Latest reply <small id="r-reply-at"></small></h3><p id="r-reply" class="pre"></p></section>
    <section><h3>Recent requests</h3><ol id="r-reqs" class="list"></ol></section>
    <section><h3>Activity</h3><ol id="r-tools" class="list mono"></ol></section>
    <section><h3>Tools used today</h3><div id="r-toolbars"></div></section>
    <section><h3>Commits <small id="r-branch"></small></h3><ol id="r-commits" class="list"></ol></section>
  </div>
  <div class="actions"><button type="button" id="r-ask">Ask what it's working on</button></div>
</div></dialog>
<div id="status" role="status" aria-live="polite">Standby</div>
<div id="log" aria-live="polite"></div>
<form id="f">
  <button type="button" id="mic" title="Talk (or hold Space)" aria-label="Talk">●</button>
  <input id="q" autocomplete="off" placeholder="Speak or type a command…" aria-label="Message">
  <button>Send</button>
</form>
<script>
const $ = s => document.querySelector(s);
const statusEl = $('#status'), logEl = $('#log'), voiceSel = $('#voice');
let ac, analyser, level = 0, mode = 'idle', rec, chunks = [], micStream;

function setStatus(t, err) { statusEl.textContent = t; statusEl.classList.toggle('err', !!err); }
function say(text, who) { const p = document.createElement('p'); p.className = who; p.textContent = text; logEl.append(p); logEl.scrollTop = 1e9; }
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r;
}
function audio() {
  if (!ac) { ac = new AudioContext(); analyser = ac.createAnalyser(); analyser.fftSize = 256; }
  return ac;
}

// ── voices ──
(async () => {
  const cfg = await (await fetch('/api/config')).json();
  try {
    const { voices } = await (await api('/api/voices')).json();
    voiceSel.innerHTML = '';
    for (const v of voices) voiceSel.add(new Option(`${v.name}${v.type === 'profile' ? '' : ' (alias)'}`, v.id));
    voiceSel.value = localStorage.getItem('neesmo-voice') || cfg.voice;
    if (!voiceSel.value) voiceSel.selectedIndex = 0;
    $('#vs').textContent = 'voice: linked';
  } catch (e) {
    voiceSel.innerHTML = `<option value="${cfg.voice}">${cfg.voice}</option>`;
    $('#vs').textContent = 'voice: offline';
    setStatus('Voice offline — text only', true);
  }
})();
voiceSel.onchange = () => { try { localStorage.setItem('neesmo-voice', voiceSel.value); } catch {} };

// ── conversation ──
async function ask(text) {
  text = text.trim(); if (!text || mode === 'thinking') return;
  say(text, 'you'); mode = 'thinking'; setStatus('Processing');
  try {
    const { reply } = await (await api('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) })).json();
    say(reply, 'vega');
    await speak(reply);
  } catch (e) { setStatus(e.message, true); }
  finally { if (mode !== 'idle') { mode = 'idle'; if (!statusEl.classList.contains('err')) setStatus('Standby'); } }
}
// Split into sentences (tiny ones joined to the next) so the first one plays while the rest are made.
function sentences(text) {
  const raw = text.match(/[^.!?…]+[.!?…]+["')\]]*\s*|[^.!?…]+$/g) || [text], out = [];
  for (const r of raw.map(t => t.trim()).filter(Boolean)) {
    if (out.length && out[out.length - 1].length < 25) out[out.length - 1] += ' ' + r; else out.push(r);
  }
  return out;
}
async function speak(text) {
  const tts = t => api('/api/speak', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t, voice: voiceSel.value }) }).then(r => r.arrayBuffer());
  const jobs = sentences(text).map(tts);   // all requested at once; played in order as each one is ready
  jobs.forEach(j => j.catch(() => {}));
  try {
    for (const job of jobs) {
      const ctx = audio(), src = ctx.createBufferSource();
      src.buffer = await ctx.decodeAudioData(await job);
      src.connect(analyser); analyser.connect(ctx.destination);
      mode = 'speaking'; setStatus('Speaking');
      await new Promise(res => { src.onended = res; src.start(); });
      analyser.disconnect();
    }
  } catch (e) { setStatus('Voice: ' + e.message, true); }
}
$('#f').onsubmit = e => { e.preventDefault(); ask($('#q').value); $('#q').value = ''; };

// ── microphone ──
// Prefer the browser's own speech recognition (instant on iPhone); fall back to the server's Whisper.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let sr = null, useServerSTT = !SR;
function startBrowserRec() {
  if (sr || mode === 'thinking') return;
  sr = new SR(); sr.lang = navigator.language || 'en-US'; sr.interimResults = false; sr.maxAlternatives = 1;
  let heard = '';
  sr.onresult = e => { heard = Array.from(e.results).map(r => r[0].transcript).join(' ').trim(); };
  sr.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'network') useServerSTT = true;
    if (e.error !== 'no-speech' && e.error !== 'aborted') setStatus('Switching to server listening', true);
  };
  sr.onend = () => { sr = null; $('#mic').classList.remove('on'); mode = 'idle'; heard ? ask(heard) : (statusEl.classList.contains('err') || setStatus('Heard nothing')); };
  sr.start(); mode = 'listening'; setStatus('Listening'); $('#mic').classList.add('on');
}
async function startRec() {
  if (rec?.state === 'recording' || mode === 'thinking') return;
  try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return setStatus('Microphone blocked', true); }
  audio().createMediaStreamSource(micStream).connect(analyser);
  chunks = []; rec = new MediaRecorder(micStream);
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => {
    micStream.getTracks().forEach(t => t.stop()); analyser.disconnect?.();
    $('#mic').classList.remove('on'); mode = 'thinking'; setStatus('Transcribing');
    const fd = new FormData(); fd.append('file', new Blob(chunks, { type: rec.mimeType }), 'speech.webm');
    try { const { text } = await (await api('/api/transcribe', { method: 'POST', body: fd })).json(); mode = 'idle'; text ? ask(text) : setStatus('Heard nothing'); }
    catch (e) { mode = 'idle'; setStatus(e.message, true); }
  };
  rec.start(); mode = 'listening'; setStatus('Listening'); $('#mic').classList.add('on');
}
const recording = () => !!sr || rec?.state === 'recording';
const stopRec = () => { if (sr) sr.stop(); else if (rec?.state === 'recording') rec.stop(); };
const listen = () => useServerSTT ? startRec() : startBrowserRec();
$('#mic').onclick = () => recording() ? stopRec() : listen();
addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body && !e.repeat) { e.preventDefault(); listen(); } });
addEventListener('keyup', e => { if (e.code === 'Space' && e.target === document.body) stopRec(); });

// ── agent cards + report ──
const AGENT_SHORT = { setup: 'Setup', glazier: 'Glazier', comics: 'Comics', gta6: 'Clips', physics: 'Physics', roblox: 'Roblox' };  // one word per card
const AGENT_COLORS = { setup: '#3dff8f', glazier: '#ffd166', comics: '#ff6b6b', gta6: '#ff7ac6', physics: '#5cc8ff', roblox: '#b388ff' };
const fmt = n => n == null ? '—' : Number(n).toLocaleString();
const kfmt = n => !n ? '0' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function loadAgents() {
  try {
    const { agents } = await (await api('/api/agents')).json(), half = Math.ceil(agents.length / 2);
    const card = a => `<button type="button" class="card agent" style="--a:${AGENT_COLORS[a.id] || '#3dff8f'}" data-id="${esc(a.id)}" aria-label="${esc(a.name)} report">
      <span class="st ${esc(a.status)}">${esc(a.status)}<span class="ago"> · ${esc(a.last_active_ago || '—')}</span></span><b>${esc(AGENT_SHORT[a.id] || a.name)}</b>
      <small>${esc(a.last_reply || a.role)}</small></button>`;
    $('#agents-l').innerHTML = agents.slice(0, half).map(card).join('');
    $('#agents-r').innerHTML = agents.slice(half).map(card).join('');
  } catch (e) { $('#agents-l').innerHTML = '<div class="card"><span>Agents</span><small>offline</small></div>'; }
}
document.addEventListener('click', e => { const b = e.target.closest('.agent'); if (b) openReport(b.dataset.id); });
let reportFor = null;
async function openReport(id) {
  reportFor = id; const dlg = $('#report');
  if (!dlg.open) dlg.showModal();
  try {
    const r = await (await api('/api/agents/' + encodeURIComponent(id))).json(); if (reportFor !== id) return;
    const t = r.today || {}, g = r.git || {}, ctxPct = Math.min(100, Math.round((r.context_tokens || 0) / 1e6 * 100));
    $('#report').style.setProperty('--a', AGENT_COLORS[r.id] || '#3dff8f');
    $('#r-name').textContent = r.name;
    $('#r-sub').innerHTML = `<span class="st ${esc(r.status)}">${esc(r.status)}</span> · ${esc(r.role)} · last active ${esc(r.last_active_ago || '—')} · ${esc(r.model || '')}`;
    const kpi = (label, val, w) => `<div class="kpi"><span>${label}</span><b>${val}</b>${w != null ? `<i style="--w:${w}%"></i>` : ''}</div>`;
    $('#r-kpis').innerHTML = kpi('Requests today', fmt(t.requests || 0)) + kpi('Tool calls today', fmt(t.tool_calls || 0))
      + kpi('Tokens written today', kfmt(t.output_tokens)) + kpi('Tokens read today', kfmt((t.input_tokens || 0) + (t.cached_tokens || 0)))
      + kpi('Context used', `${kfmt(r.context_tokens)} <small>/ 1M</small>`, ctxPct)
      + kpi('Unsaved changes', fmt(g.uncommitted)) + kpi('Not pushed', g.unpushed == null ? '—' : fmt(g.unpushed));
    $('#r-reply').textContent = r.last_reply || 'No reply yet.'; $('#r-reply-at').textContent = r.last_reply_at || '';
    $('#r-reqs').innerHTML = (r.requests || []).map(q => `<li><em>${esc(q.at)}</em>${esc(q.text)}</li>`).join('') || '<li>None yet</li>';
    $('#r-tools').innerHTML = (r.tools || []).map(x => `<li><em>${esc(x.at)}</em>${esc(x.label)}</li>`).join('') || '<li>None yet</li>';
    const max = Math.max(1, ...(r.tool_counts || []).map(x => x[1]));
    $('#r-toolbars').innerHTML = (r.tool_counts || []).map(([n, c]) => `<div class="bar"><span>${esc(n)}</span><i style="--w:${Math.round(c / max * 100)}%"></i><span>${c}</span></div>`).join('') || '<small>No tools used today</small>';
    $('#r-branch').textContent = g.branch || '';
    $('#r-commits').innerHTML = (g.commits || []).map(c => `<li><em>${esc(c.ago)}</em>${esc(c.subject)}</li>`).join('') || '<li>None</li>';
    $('#r-ask').onclick = () => { $('#report').close(); ask(`Ask the ${r.name} session what it's working on right now, then tell me in two sentences.`); };
  } catch (e) { $('#r-reply').textContent = 'Could not load: ' + e.message; }
}
$('#r-close').onclick = () => $('#report').close();
$('#report').addEventListener('click', e => { if (e.target.id === 'report') e.target.close(); });
$('#report').addEventListener('close', () => { reportFor = null; });
loadAgents(); setInterval(() => { if (!document.hidden) { loadAgents(); if (reportFor) openReport(reportFor); } }, 15000);

// ── home-screen app: notifications + replies that arrive on their own ──
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const b64 = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function setupPush() {
  if (!('serviceWorker' in navigator)) return;
  const reg = await navigator.serviceWorker.register('/sw.js');
  const bell = $('#bell');
  if (!('PushManager' in window) || !('Notification' in window)) {   // iPhone: only inside the home-screen app
    if (!standalone && /iPhone|iPad/.test(navigator.userAgent)) { bell.hidden = false; bell.textContent = '🔔 Add to Home Screen first'; bell.disabled = true; }
    return;
  }
  const on = Notification.permission === 'granted' && await reg.pushManager.getSubscription();
  bell.hidden = false; bell.textContent = on ? '🔔 On' : '🔔 Turn on notifications';
  bell.onclick = async () => {   // must run from a tap on iPhone
    try {
      if (await Notification.requestPermission() !== 'granted') return setStatus('Notifications blocked in Settings', true);
      const { key } = await (await api('/api/push/key')).json();
      const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
      await api('/api/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });
      bell.textContent = '🔔 On';
    } catch (e) { setStatus('Notifications: ' + e.message, true); }
  };
}
setupPush().catch(() => {});
let inboxAfter = 0, inboxPrimed = false;
async function pollInbox() {
  try {
    const { items } = await (await api('/api/inbox?after=' + inboxAfter)).json();
    for (const i of inboxPrimed ? items : items.slice(-3)) {   // on opening: show the last few replies, quietly
      say(`[${i.at}] ${i.text}`, 'vega');
      if (inboxPrimed && mode === 'idle' && !document.hidden) await speak(i.text);
    }
    for (const i of items) inboxAfter = Math.max(inboxAfter, i.id);
    inboxPrimed = true;
  } catch {}
}
pollInbox(); setInterval(pollInbox, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { pollInbox(); loadAgents(); } });

// ── clock ──
setInterval(() => { const d = new Date(); $('#clock').textContent = d.toLocaleTimeString(); $('#date').textContent = d.toDateString(); }, 1000);

// ── HUD ──
const cv = $('#hud'), g = cv.getContext('2d'), data = new Uint8Array(128);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', resize); resize();
function arc(r, a0, a1, w, color, blur) { g.beginPath(); g.arc(0, 0, r, a0, a1); g.lineWidth = w; g.strokeStyle = color; g.shadowBlur = blur || 0; g.shadowColor = color; g.stroke(); }
function frame(t) {
  t = reduce ? 0 : t / 1000;
  if (analyser && mode !== 'idle' && mode !== 'thinking') { analyser.getByteFrequencyData(data); level += (data.reduce((a, b) => a + b, 0) / data.length / 255 * 2.2 - level) * .3; }
  else level *= .9;
  const R = Math.min(cv.width, cv.height) * .22, hot = mode === 'listening' ? '#c6ff4a' : '#3dff8f';
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  g.translate(cv.width / 2, cv.height * (innerWidth <= 900 ? .4 : .5) - R * .15);   // phones: higher, cards go below
  // core glow
  const core = g.createRadialGradient(0, 0, 0, 0, 0, R * (.45 + level * .25));
  core.addColorStop(0, '#eaffef'); core.addColorStop(.25, hot); core.addColorStop(1, 'transparent');
  g.fillStyle = core; g.beginPath(); g.arc(0, 0, R * (.45 + level * .25), 0, 7); g.fill();
  // inner ring + spokes
  arc(R * .32, 0, 7, 2, hot, 20);
  for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283 + t * .4; arc(R * .4, a, a + .3, 6, 'rgba(61,255,143,.7)', 10); }
  // audio-reactive bars
  g.save(); g.shadowBlur = 12; g.shadowColor = hot; g.strokeStyle = hot; g.lineWidth = 2;
  for (let i = 0; i < 96; i++) {
    const a = i / 96 * 6.283 - t * .1, v = analyser && level > .02 ? data[i % 64] / 255 : (Math.sin(t * 2 + i * .5) + 1) * .04;
    const r0 = R * .58, r1 = r0 + R * (.04 + v * .35);
    g.beginPath(); g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); g.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); g.stroke();
  }
  g.restore();
  // rotating segmented rings
  for (let i = 0; i < 3; i++) { const a = t * -.25 + i * 2.094; arc(R * 1.02, a, a + 1.5, 3, 'rgba(61,255,143,.8)', 12); }
  for (let i = 0; i < 4; i++) { const a = t * .15 + i * 1.571; arc(R * 1.15, a, a + 1.1, 1.5, 'rgba(61,255,143,.45)'); }
  arc(R * 1.25, 0, 7, 1, 'rgba(61,255,143,.2)');
  // tick marks
  g.strokeStyle = 'rgba(61,255,143,.4)'; g.lineWidth = 1; g.shadowBlur = 0;
  for (let i = 0; i < 120; i++) { const a = i / 120 * 6.283 + t * .05, l = i % 10 ? 6 : 14, r = R * 1.32;
    g.beginPath(); g.moveTo(Math.cos(a) * r, Math.sin(a) * r); g.lineTo(Math.cos(a) * (r + l), Math.sin(a) * (r + l)); g.stroke(); }
  // thinking sweep
  if (mode === 'thinking') { const a = t * 4; arc(R * .85, a, a + .8, 4, '#c6ff4a', 18); arc(R * .85, a + 3.14, a + 3.94, 4, '#c6ff4a', 18); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
