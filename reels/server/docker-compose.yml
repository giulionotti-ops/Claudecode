# cd reels && cp server/.env.example server/.env (fill it) && docker compose -f server/docker-compose.yml up -d --build
services:
  reels:
    build: { context: .., dockerfile: server/Dockerfile }
    env_file: .env
    ports: ["8080:8080"]
    volumes:
      - ../episodes:/app/episodes     # scripts and finished reels stay on the host
      - ../brand.json:/app/brand.json
    restart: unless-stopped
