<title>40k Comic Shorts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: one comic "panel" card per short, next post first; thick ink borders and an offset ink shadow, like the shorts' own panels. */
:root {
  --sky: #f6c35a; --paper: #fff8e8; --ink: #1a1410; --mute: #6b5a44; --red: #e8452c; --gutter: #fde7b0;
  --display: 'Bangers', Impact, 'Arial Black', sans-serif;
  --body: 'Comic Neue', 'Trebuchet MS', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky: #2a2016; --paper: #3a2d20; --ink: #0b0806; --mute: #d9c3a0; --red: #ff6a4d; --gutter: #f1e2c4; color-scheme: dark } }
:root[data-theme="dark"] { --sky: #2a2016; --paper: #3a2d20; --ink: #0b0806; --mute: #d9c3a0; --red: #ff6a4d; --gutter: #f1e2c4; color-scheme: dark }
body { background: var(--sky); color: var(--gutter); font: 17px/1.5 var(--body); }
.card, .card * { color: var(--fg, inherit); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; margin-bottom: 26px; }
h1 { font: 400 clamp(34px, 7vw, 56px)/1 var(--display); letter-spacing: .04em; margin: 0; color: var(--red);
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); text-wrap: balance; transform: rotate(-1.5deg); }
.count { font: 13px var(--mono); color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .count { color: var(--mute); } }
:root[data-theme="dark"] .count { color: var(--mute); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 28px; align-items: start; }
.card { --fg: var(--ink); background: var(--paper); border: 4px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card { --fg: var(--gutter); } }
:root[data-theme="dark"] .card { --fg: var(--gutter); }
.num { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { font: 400 20px/1 var(--display); letter-spacing: .06em; background: var(--red); color: #fff; border: 3px solid var(--ink); padding: 5px 10px 3px; transform: rotate(-2deg); }
.made { font: 12px var(--mono); color: var(--mute); }
.story { font: 400 28px/1 var(--display); letter-spacing: .04em; margin: -4px 0 0; }
video { width: 100%; max-width: 100%; aspect-ratio: 9 / 16; max-height: 580px; background: #000; display: block; object-fit: contain; border: 3px solid var(--ink); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.dl { flex: 1 1 180px; display: flex; justify-content: center; align-items: baseline; gap: 8px; font: 400 20px/1 var(--display); letter-spacing: .06em; color: var(--ink); background: var(--sky); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 11px 14px 9px; text-decoration: none; }
.dl.alt { background: var(--paper); flex: 0 1 auto; }
.dl:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.dl:focus-visible, .copy:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.dl small { font: 12px var(--mono); letter-spacing: 0; opacity: .75; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dl { color: var(--gutter); } }
:root[data-theme="dark"] .dl { color: var(--gutter); }
.title { font: 700 20px/1.3 var(--body); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.row { display: flex; align-items: flex-start; gap: 10px; }
.row > :first-child { flex: 1; min-width: 0; }
.copy { flex: none; font: 12px var(--mono); color: var(--fg); background: transparent; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.copy:hover { background: var(--sky); }
.lbl { font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 0 0 4px; }
.desc { white-space: pre-line; margin: 0; overflow-wrap: anywhere; }
.pin { margin: 0; font-style: italic; overflow-wrap: anywhere; }
.upload { border-top: 3px dashed var(--ink); padding-top: 14px; display: grid; gap: 6px; }
.upload h3 { font: 400 20px/1 var(--display); letter-spacing: .06em; margin: 0; color: var(--red); }
.when { font: 14px var(--mono); font-variant-numeric: tabular-nums; }
.notes { margin: 0; font-size: 15px; color: var(--mute); }
@media (prefers-reduced-motion: reduce) { .dl:hover { transform: none; } }
</style>

<div class="wrap">
  <header>
    <h1>40k Comic Shorts</h1>
    <div class="count" id="count">Loading shorts…</div>
  </header>
  <main class="grid" id="grid"></main>
</div>

<template id="tpl">
  <article class="card">
    <div class="num"><span class="tag" data-k="num"></span><span class="made" data-k="made"></span></div>
    <p class="story" data-k="name"></p>
    <video controls playsinline preload="metadata"></video>
    <div class="btns">
      <a class="dl" data-k="dl" target="_blank" rel="noopener">Download full quality</a>
      <a class="dl alt" data-k="cc" target="_blank" rel="noopener">Captions .srt</a>
    </div>
    <div class="row"><h2 class="title" data-k="title"></h2><button class="copy" data-copy="title" type="button">Copy</button></div>
    <div class="row"><div><p class="lbl">Description</p><p class="desc" data-k="description"></p></div><button class="copy" data-copy="description" type="button">Copy</button></div>
    <div class="row"><div><p class="lbl">Pinned comment</p><p class="pin" data-k="pinned"></p></div><button class="copy" data-copy="pinned" type="button">Copy</button></div>
    <section class="upload">
      <h3>Post it</h3>
      <div class="when" data-k="when"></div>
      <p class="notes" data-k="notes"></p>
    </section>
  </article>
</template>

<script>
const grid = document.getElementById('grid'), tpl = document.getElementById('tpl');
function select(btn) { const el = btn.parentElement.querySelector('[data-k]'); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected'; }
function copy(btn, text) {
  const done = () => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1400); };
  try { navigator.clipboard.writeText(text).then(done, () => select(btn)); } catch { select(btn); }
}
function fmt(d) { try { return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); } catch { return d; } }
fetch('shorts.json').then(r => r.json()).then(list => {
  list.sort((a, b) => a.n - b.n);
  document.getElementById('count').textContent = `${list.length} shorts · one a day, in order`;
  for (const s of list) {
    const c = tpl.content.cloneNode(true);
    c.querySelector('[data-k="num"]').textContent = `Short #${s.n}`;
    c.querySelector('[data-k="made"]').textContent = [s.length, s.made && `made ${fmt(s.made)}`].filter(Boolean).join(' · ');
    for (const k of ['name', 'title', 'description', 'pinned', 'when', 'notes']) c.querySelector(`[data-k="${k}"]`).textContent = s[k] || '';
    const v = c.querySelector('video'); v.src = s.video; if (s.poster) v.poster = s.poster;
    const dl = c.querySelector('[data-k="dl"]'); dl.href = s.download;
    dl.innerHTML = `Download full quality <small>1080p · ${s.size_mb} MB</small>`;
    const cc = c.querySelector('[data-k="cc"]'); if (s.captions) cc.href = s.captions; else cc.remove();
    c.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copy(b, s[b.dataset.copy] || '')));
    grid.appendChild(c);
  }
}).catch(() => { document.getElementById('count').textContent = 'Could not load the list of shorts. Reload the page to try again.'; });
</script>
